[project]
name = "ai-agent-cookbook"
version = "0.1.0"
description = "A notebook-first guide to AI Agent engineering, from foundations to production systems."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agent-framework-core>=1.11.0",
    "agent-framework-openai>=1.10.1",
    "agent-framework-orchestrations>=1.0.0",
    "chromadb>=1.5.9",
    "jieba>=0.42.1",
    "jsonschema>=4.26.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "mcp>=1.28.1",
    "openai>=2.42.0",
    "pydantic-ai>=2.12.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
